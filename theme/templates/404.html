{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Page not found" %} · {% trans "Electronics Lab" %}{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-slate-800 bg-slate-900/60 p-8 text-center">
    <p class="text-sm font-medium tabular-nums text-teal-400">404</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-100">{% trans "Page not found" %}</h1>
    <p class="mt-3 text-sm text-slate-400">{% trans "This page doesn't exist or has moved." %}</p>
    <a href="{% url 'curriculum:home' %}"
       class="mt-6 inline-flex items-center gap-1.5 rounded-lg bg-cyan-500/10 px-3 py-1.5 text-sm font-medium text-teal-400 ring-1 ring-inset ring-teal-500/20 transition-colors duration-200 ease-out hover:bg-cyan-500/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-400">
        <span aria-hidden="true">←</span> {% trans "Back to chapters" %}
    </a>
</section>
{% endblock %}
