[project]
name = "electronics-lab"
version = "0.1.0"
description = "Plateforme bilingue (FR/EN) d'apprentissage de l'électronique"
requires-python = ">=3.12"  # django-unfold 0.108 requires 3.12+

# --- Lint + format ----------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"          # PythonAnywhere offers 3.12 and 3.13
extend-exclude = [".revision", "apps/*/migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # pyupgrade
    "DJ",            # flake8-django
    "S",             # bandit (security)
    "SIM",           # simplifications
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]            # asserts and dummy passwords are fine in tests
"config/settings/base.py" = ["S105"]              # the dev-only placeholder key (rejected in production)
"config/settings/development.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]

# --- Coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
